<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reporte de Ventas — Tagua &amp; NFG</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f4f5f7;--card:#ffffff;--border:#e3e6ea;--txt:#1a1d24;--muted:#6b7280;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;padding:24px}
  h1{font-size:22px;margin:0 0 2px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
  .aviso{background:#fef3c7;border:1px solid #fde68a;color:#92400e;
         padding:8px 12px;border-radius:8px;font-size:12.5px;margin-bottom:18px}
  .bar{display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
  .toggle{display:inline-flex;background:var(--card);border:1px solid var(--border);
          border-radius:10px;padding:4px;gap:4px}
  .toggle button{background:transparent;border:0;color:var(--muted);padding:8px 16px;
          border-radius:7px;cursor:pointer;font-size:13.5px;font-weight:600}
  .toggle.marca button.active[data-m="AMBOS"]{background:#5b21b6;color:#fff}
  .toggle.marca button.active[data-m="TAGUA"]{background:#7c2d12;color:#fff}
  .toggle.marca button.active[data-m="NFG"]{background:#134e2e;color:#fff}
  .toggle.gran button.active,.toggle.metric button.active{background:#2a5bd7;color:#fff}
  .anios{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .anios .lbl{color:var(--muted);font-size:12px;margin-right:2px}
  .chip{background:var(--card);border:1px solid var(--border);color:var(--muted);
        padding:6px 11px;border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:600}
  .chip.on{background:#111827;color:#fff;border-color:#111827}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:16px 0 22px}
  .kpi{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px}
  .kpi.total{border-color:#5b21b6}
  .kpi .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .kpi .val{font-size:24px;font-weight:700;margin-top:6px}
  .kpi .foot{font-size:11.5px;color:var(--muted);margin-top:6px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle}
  .card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px;margin-bottom:20px}
  .card h3{margin:0 0 10px;font-size:14px;color:var(--muted);font-weight:600}
  .chart-wrap{height:380px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--border)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
  .tbl-scroll{max-height:360px;overflow:auto}
  tr:hover td{background:#f1f3f5}
  .sd{color:var(--muted);font-style:italic}
</style>
</head>
<body>
  <h1>Reporte de Ventas — Tagua &amp; NFG</h1>
  <div class="sub" id="sub"></div>

  <div class="bar">
    <div class="toggle marca" id="marca">
      <button data-m="AMBOS" class="active">Ambos</button>
      <button data-m="TAGUA">Tagua</button>
      <button data-m="NFG">NFG</button>
    </div>
    <div class="toggle gran" id="gran">
      <button data-g="diario">Día</button>
      <button data-g="semanal">Semana</button>
      <button data-g="mensual" class="active">Mes</button>
      <button data-g="anual">Año</button>
    </div>
    <div class="toggle metric" id="metric" style="display:none">
      <button data-k="total" class="active">Total</button>
      <button data-k="so">Sales Orders</button>
      <button data-k="sq">Quotes</button>
      <button data-k="inv">Invoices</button>
    </div>
  </div>
  <div class="anios bar" id="anios"></div>

  <div class="aviso" id="aviso"></div>
  <div class="kpis" id="kpis"></div>
  <div class="card"><h3 id="tabla-tit"></h3><div class="tbl-scroll"><table id="tabla"></table></div></div>
  <div class="card"><h3 id="chart-tit"></h3><div class="chart-wrap"><canvas id="chart"></canvas></div></div>

const MES = ["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
const PALETA = ["#2563eb","#d97706","#16a34a","#dc2626","#7c3aed","#0891b2","#db2777","#65a30d","#ea580c","#475569"];
let marca="AMBOS", gran="mensual", metric="total";
let aniosSel = new Set([String(DATA.anio_actual)]);
let chart;
const fmt = n => (n<0?"-$":"$") + Math.abs(Math.round(n)).toLocaleString("en-US");
const fmtShort = n => Math.abs(n)>=1000 ? (n<0?"-$":"$")+Math.abs(n/1000).toFixed(1)+"k" : "$"+Math.round(n);
const valMetric = (m, i, obj) => {
  if(m==="total"){ const so=obj.so?obj.so[i]:0, sq=obj.sq?obj.sq[i]:0; return so+sq; }
  return obj[m] ? obj[m][i] : 0;
};
// último mes (0-11) con algún dato != 0; -1 si el año está vacío
const ultMes = m => {
  let last=-1;
  for(let i=0;i<12;i++){
    const so=m.so?m.so[i]:0, sq=m.sq?m.sq[i]:0, inv=m.inv?m.inv[i]:0;
    if(so!==0||sq!==0||inv!==0) last=i;
  }
  return last;
};

document.getElementById("sub").textContent =
  "Generado " + DATA.generado + " · Tagua = NAV · NFG = QuickBooks";

// -------- chips de años (según marca) --------
function pintarChips(){
  const D = DATA.marcas[marca];
  const cont = document.getElementById("anios");
  cont.innerHTML = '<span class="lbl">Años:</span>';
  D.anios.forEach(y=>{
    const b = document.createElement("button");
    b.className = "chip" + (aniosSel.has(y)?" on":"");
    b.textContent = y; b.dataset.y = y;
    b.onclick = ()=>{
      if(aniosSel.has(y)){ if(aniosSel.size>1) aniosSel.delete(y); }
      else aniosSel.add(y);
      pintarChips(); render();
    };
    cont.appendChild(b);
  });
}
function aniosVigentes(){
  const D = DATA.marcas[marca];
  let ys = D.anios.filter(y=>aniosSel.has(y));
  if(!ys.length) ys = [String(DATA.anio_actual)].filter(y=>D.anios.includes(y));
  if(!ys.length) ys = [D.anios[D.anios.length-1]];
  return ys.sort();
}

function render(){
  const D = DATA.marcas[marca];
  const modoComp = (gran==="mensual" && aniosVigentes().length>=2);
  document.getElementById("metric").style.display = modoComp ? "inline-flex" : "none";
  document.getElementById("anios").style.opacity = (gran==="diario"||gran==="semanal") ? .45 : 1;

  // aviso
  let av = "⚠ Datos del año en curso hasta <b>"+D.fecha_max+"</b> (período parcial).";
  if(gran==="diario"||gran==="semanal") av += " Día y Semana muestran solo "+DATA.anio_actual+".";
  if(D.nota) av += " " + D.nota;
  document.getElementById("aviso").innerHTML = av;

  // KPIs (siempre año en curso)
  const kdiv = document.getElementById("kpis"); kdiv.innerHTML="";
  const tarjeta=(cls,color,label,val,foot)=>
    `<div class="kpi ${cls}"><div class="lbl"><span class="dot" style="background:${color}"></span>${label} · ${DATA.anio_actual} YTD</div>
     <div class="val">${val}</div><div class="foot">${foot}</div></div>`;
  const foot=k=>k.filas.toLocaleString("en-US")+" líneas · hasta "+k.hasta;
  const kso=D.kpis.so,ksq=D.kpis.sq,kinv=D.kpis.inv;
  kdiv.innerHTML += tarjeta("",DATA.meta.so.color,"Sales Orders",fmt(kso.total),foot(kso));
  kdiv.innerHTML += tarjeta("",DATA.meta.sq.color,"Sales Quotes",ksq?fmt(ksq.total):'<span class="sd">s/d</span>',ksq?foot(ksq):"sin fuente");
  const totV = kso.total + (ksq?ksq.total:0);
  kdiv.innerHTML += tarjeta("total","#a855f7","Total (SO + Quotes)",fmt(totV),ksq?"suma de las dos columnas":"solo SO (NFG sin quotes)");
  kdiv.innerHTML += tarjeta("",DATA.meta.inv.color,"Invoices",fmt(kinv.total),foot(kinv));

  if(modoComp) renderComparativo();
  else if(gran==="anual") renderAnual();
  else renderSerie();   // diario / semanal / mensual(1 año)
}

// ----- serie simple (día/semana/mes de un año) -----
function renderSerie(){
  const D = DATA.marcas[marca];
  let labels, obj, titulo;
  if(gran==="diario"||gran==="semanal"){
    const s = D[gran]; obj = s; labels = s.labels_legibles || s.labels;
    titulo = (gran==="diario"?"Diario ":"Semanal ")+DATA.anio_actual;
  } else { // mensual 1 año — recorta meses sin datos todavía (año en curso)
    const y = aniosVigentes()[0]; const m = D.meses[y];
    const last = ultMes(m); const n = last>=0 ? last+1 : 12;
    obj = {so:m.so.slice(0,n), sq:m.sq?m.sq.slice(0,n):null, inv:m.inv.slice(0,n)};
    labels = MES.slice(0,n);
    titulo = "Mensual "+y;
  }
  const sqNull = !obj.sq;
  // chart
  const ds = [];
  [["so","Sales Orders"],["sq","Sales Quotes"],["inv","Invoices"]].forEach(([e,lab])=>{
    if(e==="sq" && sqNull) return;
    ds.push({label:lab,data:obj[e],borderColor:DATA.meta[e].color,
      backgroundColor:DATA.meta[e].color+"33",borderWidth:2,tension:.25,
      pointRadius:gran==="diario"?0:3,maxBarThickness:26});
  });
  dibujar(gran==="diario"?"line":"bar", labels, ds, titulo);
  // tabla 4 columnas
  let h="<thead><tr><th>Período</th><th>Sales Orders</th><th>Sales Quotes</th><th>Total</th><th>Invoices</th></tr></thead><tbody>";
  for(let i=labels.length-1;i>=0;i--){
    const sqv = sqNull?0:obj.sq[i]; const tot=obj.so[i]+sqv;
    h+=`<tr><td>${labels[i]}</td><td>${fmt(obj.so[i])}</td>`+
       `<td>${sqNull?'<span class="sd">s/d</span>':fmt(obj.sq[i])}</td>`+
       `<td><b>${fmt(tot)}</b></td><td><b>${fmt(obj.inv[i])}</b></td></tr>`;
  }
  document.getElementById("tabla").innerHTML = h+"</tbody>";
  document.getElementById("tabla-tit").textContent = "Detalle — "+titulo;
}

// ----- anual (barras por año) -----
function renderAnual(){
  const D = DATA.marcas[marca]; const a = D.anual; const labels = a.labels;
  const ds=[];
  [["so","Sales Orders"],["sq","Sales Quotes"],["inv","Invoices"]].forEach(([e,lab])=>{
    ds.push({label:lab,data:a[e].map(v=>v==null?0:v),borderColor:DATA.meta[e].color,
      backgroundColor:DATA.meta[e].color+"cc",borderWidth:1,maxBarThickness:34});
  });
  dibujar("bar", labels, ds, "Total por año");
  let h="<thead><tr><th>Año</th><th>Sales Orders</th><th>Sales Quotes</th><th>Total</th><th>Invoices</th></tr></thead><tbody>";
  for(let i=labels.length-1;i>=0;i--){
    const so=a.so[i]||0, sq=a.sq[i], inv=a.inv[i]||0; const tot=so+(sq||0);
    h+=`<tr><td>${labels[i]}</td><td>${fmt(so)}</td>`+
       `<td>${sq==null?'<span class="sd">s/d</span>':fmt(sq)}</td>`+
       `<td><b>${fmt(tot)}</b></td><td><b>${fmt(inv)}</b></td></tr>`;
  }
  document.getElementById("tabla").innerHTML=h+"</tbody>";
  document.getElementById("tabla-tit").textContent="Detalle — total por año";
}

// ----- comparativo YoY (mes a mes, varios años, una métrica) -----
function renderComparativo(){
  const D = DATA.marcas[marca]; const ys = aniosVigentes();
  const nombreMetric = {total:"Total (SO+Quotes)",so:"Sales Orders",sq:"Sales Quotes",inv:"Invoices"}[metric];
  const lastByYear = {};
  ys.forEach(y=>{ lastByYear[y] = ultMes(D.meses[y]); });
  const ds = ys.map((y,idx)=>{
    const m = D.meses[y]; const last = lastByYear[y];
    const data = MES.map((_,i)=> i<=last ? valMetric(metric,i,m) : null);
    const c = PALETA[idx % PALETA.length];
    return {label:y,data,borderColor:c,backgroundColor:c+"22",borderWidth:2,tension:.25,pointRadius:3,spanGaps:false};
  });
  dibujar("line", MES.slice(), ds, "Comparativo "+nombreMetric+" · "+ys.join(" vs "));
  // tabla meses x años ("—" en meses sin datos de ese año)
  let h="<thead><tr><th>Mes</th>"+ys.map(y=>`<th>${y}</th>`).join("")+"</tr></thead><tbody>";
  for(let i=0;i<12;i++){
    h+=`<tr><td>${MES[i]}</td>`+ys.map(y=>
        i<=lastByYear[y] ? `<td>${fmt(valMetric(metric,i,D.meses[y]))}</td>`
                         : '<td><span class="sd">—</span></td>').join("")+"</tr>";
  }
  document.getElementById("tabla").innerHTML=h+"</tbody>";
  document.getElementById("tabla-tit").textContent="Comparativo "+nombreMetric+" — mes a mes";
}

function dibujar(tipo, labels, datasets, titulo){
  document.getElementById("chart-tit").textContent = titulo;
  if(chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"),{
    type:tipo, data:{labels,datasets},
    options:{responsive:true,maintainAspectRatio:false,
      interaction:{mode:"index",intersect:false},
      plugins:{legend:{labels:{color:"#1a1d24",usePointStyle:true}},
        tooltip:{callbacks:{label:c=>c.dataset.label+": "+fmt(c.parsed.y)}}},
      scales:{x:{ticks:{color:"#6b7280",maxRotation:0,autoSkip:true,
                 maxTicksLimit:gran==="diario"?12:24},grid:{color:"#eceef1"}},
              y:{ticks:{color:"#6b7280",callback:v=>fmtShort(v)},grid:{color:"#eceef1"}}}}
  });
}

// -------- eventos --------
document.getElementById("marca").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  marca=e.target.dataset.m;
  document.querySelectorAll("#marca button").forEach(b=>b.classList.toggle("active",b.dataset.m===marca));
  // recortar años seleccionados a los disponibles de la marca
  const disp=new Set(DATA.marcas[marca].anios);
  aniosSel=new Set([...aniosSel].filter(y=>disp.has(y)));
  if(!aniosSel.size) aniosSel.add(String(DATA.anio_actual));
  pintarChips(); render();
});
document.getElementById("gran").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  gran=e.target.dataset.g;
  document.querySelectorAll("#gran button").forEach(b=>b.classList.toggle("active",b.dataset.g===gran));
  render();
});
document.getElementById("metric").addEventListener("click",e=>{
  if(e.target.tagName!=="BUTTON")return;
  metric=e.target.dataset.k;
  document.querySelectorAll("#metric button").forEach(b=>b.classList.toggle("active",b.dataset.k===metric));
  render();
});

pintarChips();
render();
</script>
